# Production example configuration.
# Copy the values into your deployment platform configuration and replace placeholders.

appname = expense-tracker-api
httpport = 8080
runmode = prod
copyrequestbody = true

# Use Postgres for hosted production deployments.
storage_driver = postgres
postgres_dsn = postgres://USER:PASSWORD@HOST:PORT/DBNAME?sslmode=require
postgres_auto_migrate = true

# Kept for documentation/fallback reference. CSV remains the local assignment mode.
csv_user_file = data/users.csv
csv_expense_file = data/expenses.csv
