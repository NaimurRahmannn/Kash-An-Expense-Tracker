services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_password
    ports:
      - "5432:5432"
    volumes:
      - expense_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      STORAGE_DRIVER: "postgres"
      POSTGRES_DSN: "postgres://expense_user:expense_password@postgres:5432/expense_tracker?sslmode=disable"
      POSTGRES_AUTO_MIGRATE: "true"

volumes:
  expense_postgres_data:
